<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Приглашение в Lali</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap">
<style>
/* Layout: one centered line of italic serif on a deep ink-wine ground; text fades in after a pause. */
:root {
  --bg: #1a1114;
  --fg: #f1e8e0;
  --soft: #b99da0;
  --display: "Marck Script", "Segoe Script", "Brush Script MT", cursive;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  margin: 0;
  padding-block: 0;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: grid;
  place-items: center;
  font-family: var(--display);
}
main { text-align: center; max-width: 13ch; min-width: 0; }
p {
  margin: 0;
  font-weight: 400;
  font-size: clamp(2.8rem, 15vw, 4.8rem);
  line-height: 1.2;
  letter-spacing: 0;
  text-wrap: balance;
  opacity: 0;
  animation: reveal 3.6s ease-in-out 2s forwards, pulse 9s ease-in-out 5.6s infinite;
}
.when { display: block; margin-top: 1.1em; font-size: 0.5em; color: var(--soft); letter-spacing: 0.05em; font-variant-numeric: lining-nums tabular-nums; }
@keyframes reveal {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.025); }
}
@media (prefers-reduced-motion: reduce) {
  p { animation: none; opacity: 1; }
}
</style>
<main>
  <p>Позволь мне увидеть тебя в Lali<span class="when">13.11 · 16:00 ❤️</span></p>
</main>

</body></html>
